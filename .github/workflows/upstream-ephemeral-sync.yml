name: Upstream ephemeral sync (create ephemeral PR & enable auto-merge)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *'  # daily 02:00 UTC (adjust as needed)

permissions:
  contents: write

env:
  UPSTREAM_REPO: "jniebuhr/gaggimate"   # canonical upstream to base ephemeral branches on
  BASE_BRANCH: "master"                 # target branch in this repo

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.create_pr.outputs['pull-request-url'] || '' }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: true

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        shell: bash

      - name: Add upstream remote & fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true
          git fetch upstream --depth=1
        shell: bash

      - name: Create ephemeral branch from upstream/master
        id: create_branch
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          BRANCH="automation/upstream-sync-${TIMESTAMP}"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          git checkout -b "${BRANCH}" upstream/master
          echo "Created ephemeral branch ${BRANCH}"
        shell: bash

      - name: Import helper scripts from origin/master into ephemeral branch
        id: import_helpers
        run: |
          set -euo pipefail
          echo "Fetching origin/master..."
          git fetch origin master --depth=1 || true

          FILES=(
            "scripts/generate_board_override.py"
            "scripts/pio_prebuild_generate_override.py"
            "scripts/pio_prebuild_copy_override.py"
            "scripts/apply_board_override_patch.sh"
          )

          CHANGED=false
          for f in "${FILES[@]}"; do
            if git ls-tree --name-only origin/master -- "$f" | grep -q .; then
              echo "Checking out $f from origin/master"
              git checkout origin/master -- "$f"
              CHANGED=true
            else
              echo "Not present in origin/master: $f (skipping)"
            fi
          done

          if [ "$CHANGED" = "true" ]; then
            git add ${FILES[*]} || true
            if ! git diff --cached --quiet; then
              git commit -m "chore: add helper scripts required for ephemeral sync" || true
              echo "helpers_committed=true" >> $GITHUB_OUTPUT
            else
              echo "No helper script changes to commit"
              echo "helpers_committed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No helper scripts imported"
            echo "helpers_committed=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Ensure helper scripts are executable
        run: |
          chmod +x scripts/*.sh || true
        shell: bash

      - name: Run generator and copy (ensure generator is present)
        id: gen
        run: |
          set -euo pipefail
          echo "Running generator..."
          python3 scripts/generate_board_override.py
          echo "Running prebuild copy..."
          python3 scripts/pio_prebuild_copy_override.py
        shell: bash

      - name: Apply the small board-override patch (idempotent)
        id: patch
        run: |
          set -euo pipefail
          echo "Applying source patch..."
          bash scripts/apply_board_override_patch.sh
        shell: bash

      - name: Verify patch results (diagnostics)
        run: |
          echo "Git status (HEAD):"
          git status --porcelain -b || true
          echo "=== head of lib/GaggiMateController/src/GaggiMateController.cpp ==="
          sed -n '1,300p' lib/GaggiMateController/src/GaggiMateController.cpp || true
          echo "=== generated header preview ==="
          sed -n '1,160p' src/generated/board_override.h || true
        shell: bash

      - name: Stage generated and patched files (if any)
        id: stage
        run: |
          set -euo pipefail
          FILES=(
            "src/generated/board_override.h"
            "lib/GaggiMateController/src/generated/board_override.h"
            "lib/GaggiMateController/src/GaggiMateController.cpp"
            "config/board_override.json"
            "data/board_override.json"
          )

          ADDED=false
          echo "Checking for files to add..."
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              git add "$f"
              echo "Staged: $f"
              ADDED=true
            else
              echo "Not present: $f"
            fi
          done

          echo "Staged files (git status):"
          git status --porcelain || true

          if [ "$ADDED" = "true" ]; then
            if ! git diff --cached --quiet; then
              git commit -m "chore: regenerate board_override + apply patch" || true
              echo "committed=true" >> $GITHUB_OUTPUT
            else
              echo "No staged content changes to commit"
              echo "committed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No files to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Push ephemeral branch (if commits were made)
        id: push_branch
        if: ${{ steps.stage.outputs.committed == 'true' || steps.import_helpers.outputs.helpers_committed == 'true' }}
        run: |
          set -euo pipefail
          BRANCH="${{ steps.create_branch.outputs.branch }}"
          echo "branch=${BRANCH}"
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            if ! git diff --quiet "origin/${BRANCH}" HEAD; then
              git push origin HEAD:"${BRANCH}"
              echo "pushed=true" >> $GITHUB_OUTPUT
            else
              echo "No changes to push (origin/${BRANCH} == HEAD)"
              echo "pushed=false" >> $GITHUB_OUTPUT
            fi
          else
            git push origin HEAD:"${BRANCH}"
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Create or update Pull Request (peter-evans)
        id: create_pr
        if: ${{ steps.push_branch.outputs.pushed == 'true' }}
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerate board_override + apply patch"
          title: "automation: upstream sync — apply board_override patch"
          body: |
            Automated ephemeral PR: apply the small board override change and include generated artifacts.

            This PR will be auto-merged when required checks pass.
          base: ${{ env.BASE_BRANCH }}
          branch: ${{ steps.create_branch.outputs.branch }}
          labels: automation,ci

      - name: Enable auto-merge for PR (squash)
        if: ${{ steps.create_pr.outputs['pull-request-number'] != '' }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.create_pr.outputs['pull-request-number'] }}"
          REPO="${{ github.repository }}"
          echo "Enabling auto-merge for PR #${PR_NUMBER}"
          curl -s -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/auto-merge" \
            -d '{"merge_method":"squash"}' | jq .
        env:
          REPO: ${{ github.repository }}
        shell: bash

      - name: Output result
        if: ${{ steps.create_pr.outputs['pull-request-url'] != '' }}
        run: |
          echo "PR created: ${{ steps.create_pr.outputs['pull-request-url'] }}"
        shell: bash

      - name: Create issue on failure (via REST API)
        if: failure()
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TITLE="Upstream ephemeral sync failed"
          BODY="The ephemeral upstream sync workflow failed. Check workflow run: ${GITHUB_RUN_URL:-https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}}"
          echo "Creating issue in ${REPO}"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues" \
            -d "$(jq -n --arg t "$TITLE" --arg b "$BODY" '{title:$t, body:$b}')" | jq .
        env:
          REPO: ${{ github.repository }}
        shell: bash
